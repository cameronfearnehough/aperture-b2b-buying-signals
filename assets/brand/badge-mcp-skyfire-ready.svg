<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="36" viewBox="0 0 360 36">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>
    <linearGradient id="violetGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="borderGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Outer Pill Background -->
  <rect x="0.5" y="0.5" width="359" height="35" rx="7" fill="url(#bgGrad3)" stroke="url(#borderGrad3)" stroke-width="1"/>

  <!-- Left Pill: Violet Chip & CLAY & N8N -->
  <rect x="3" y="3" width="128" height="30" rx="5" fill="url(#violetGrad3)"/>
  <rect x="9" y="12" width="12" height="12" rx="2.5" fill="#4C1D95" stroke="#C4B5FD" stroke-width="1.2"/>
  <circle cx="15" cy="18" r="2.5" fill="#FFFFFF"/>
  <text x="74" y="22.5" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">CLAY &amp; N8N</text>

  <!-- Right Section: MCP & AGENT READY -->
  <text x="242" y="22.5" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">MCP &amp; AGENT READY</text>
</svg>