<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Dark Slate Squircle Card -->
  <rect x="8" y="8" width="496" height="496" rx="96" ry="96" fill="url(#cardBg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="8" y="8" width="496" height="496" rx="96" ry="96" fill="url(#centerGlow)"/>

  <!-- Technical Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.35">
    <line x1="64" y1="8" x2="64" y2="504"/>
    <line x1="128" y1="8" x2="128" y2="504"/>
    <line x1="192" y1="8" x2="192" y2="504"/>
    <line x1="320" y1="8" x2="320" y2="504"/>
    <line x1="384" y1="8" x2="384" y2="504"/>
    <line x1="448" y1="8" x2="448" y2="504"/>
    <line x1="8" y1="128" x2="504" y2="128"/>
    <line x1="8" y1="192" x2="504" y2="192"/>
    <line x1="8" y1="384" x2="504" y2="384"/>
    <line x1="8" y1="448" x2="504" y2="448"/>
  </g>

  <!-- Outer Rim Accent Stroke -->
  <rect x="12" y="12" width="488" height="488" rx="92" ry="92" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" opacity="0.85"/>

  <!-- Center 6-Blade Camera Aperture Shutter Ring & Radar Pulse (Circle-Safe Centered at 256, 256) -->
  <g id="apertureMechanism" transform="translate(256, 256)">
    <!-- Outer Mechanism Ring (outerRadius=196) -->
    <circle r="196" fill="none" stroke="url(#rimGrad)" stroke-width="6"/>

    <!-- Shutter Blades (outerRadius=196, innerRadius=86) -->
    <g fill="url(#bladeGrad)" stroke="url(#rimGrad)" stroke-width="2" opacity="0.95">
      <path d="M 0,-86 L 170,-98 A 196 196 0 0 1 196,0 L 74,43 Z"/>
      <path d="M 0,-86 L 170,-98 A 196 196 0 0 1 196,0 L 74,43 Z" transform="rotate(60)"/>
      <path d="M 0,-86 L 170,-98 A 196 196 0 0 1 196,0 L 74,43 Z" transform="rotate(120)"/>
      <path d="M 0,-86 L 170,-98 A 196 196 0 0 1 196,0 L 74,43 Z" transform="rotate(180)"/>
      <path d="M 0,-86 L 170,-98 A 196 196 0 0 1 196,0 L 74,43 Z" transform="rotate(240)"/>
      <path d="M 0,-86 L 170,-98 A 196 196 0 0 1 196,0 L 74,43 Z" transform="rotate(300)"/>
    </g>

    <!-- Inner Radar Pulse Core (innerRadius=86) -->
    <circle r="86" fill="#0B1324" stroke="#06B6D4" stroke-width="3"/>
    <circle r="52" fill="none" stroke="#10B981" stroke-width="2" opacity="0.75"/>
    <circle r="26" fill="none" stroke="#06B6D4" stroke-width="1.8" opacity="0.85"/>

    <!-- Radar Crosshairs -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>

    <!-- Radar Sweep Cone -->
    <path d="M 0,0 L 75,-25 A 79 79 0 0 0 25,-75 Z" fill="#06B6D4" opacity="0.32"/>

    <!-- Glowing Blips -->
    <circle cx="34" cy="-28" r="5" fill="#10B981"/>
    <circle cx="34" cy="-28" r="2.5" fill="#FFFFFF"/>
    <circle cx="-25" cy="-20" r="4" fill="#06B6D4"/>
    <circle cx="21" cy="36" r="4" fill="#10B981"/>
    <circle cx="0" cy="0" r="5" fill="#06B6D4"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>